# Automatically build, test, and publish Cobblemon Cards (Fabric + NeoForge)
# to Modrinth, CurseForge, and GitHub Releases when pushing a version tag (e.g. v2.1.0)
# or triggering manually from the GitHub Actions tab.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not actually upload to Modrinth/CurseForge)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test (Common, Fabric, NeoForge)
        run: ./gradlew :common:test :fabric:build :neoforge:build --console=plain

      - name: Publish to Modrinth & CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          DRY_RUN="${{ inputs.dry_run || false }}"
          ./gradlew :fabric:publishMods :neoforge:publishMods -PpublishDryRun="$DRY_RUN" --console=plain

      - name: Extract changelog for GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'EOF' > release_notes.md
          import sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          out, capturing = [], False
          for line in text.splitlines():
              if line.startswith("## "):
                  if capturing:
                      break
                  if version in line:
                      capturing = True
                      continue
              if capturing:
                  out.append(line)
          print("\n".join(out).strip() or f"Release {version}")
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cobblemon Cards ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: |
            fabric/build/libs/cobblemon-cards-fabric-*.jar
            neoforge/build/libs/cobblemon-cards-neoforge-*.jar
            !fabric/build/libs/*-sources.jar
            !neoforge/build/libs/*-sources.jar
