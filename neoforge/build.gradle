plugins {
    id 'net.neoforged.moddev'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "cobblemon-cards-neoforge"
}

evaluationDependsOn(':common')
def commonProject = project(':common')

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cobblemon_cards'
        }
        client2 {
            client()
            programArguments.addAll '--username', 'Dev2'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cobblemon_cards'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "cobblemon_cards" {
            sourceSet sourceSets.main
            sourceSet commonProject.sourceSets.main
            sourceSet commonProject.sourceSets.client
        }
    }
}

dependencies {
    implementation(project(":common")) {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }
    implementation commonProject.sourceSets.client.output
    implementation "thedarkcolour:kotlinforforge-neoforge:${project.kotlin_for_forge_version}"

    // Cobblemon NeoForge
    implementation "maven.modrinth:cobblemon:${project.neoforge_cobblemon_version}"
    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"

    // Accessories API (NeoForge version)
    implementation("io.wispforest:accessories-neoforge:${project.accessories_version}") {
        // owo-lib bundles the matching Endec and Forgified Fabric API libraries.
        // Avoid the older copies from Accessories' Maven metadata on the runtime classpath.
        transitive = false
    }
    implementation "maven.modrinth:owo-lib:${project.neoforge_owo_modrinth_version}"

    // MidnightLib (NeoForge version)
    implementation "maven.modrinth:midnightlib:${project.neoforge_midnightlib_version}"

    // Recipe Viewers
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${project.rei_version}"
    compileOnly "dev.emi:emi-neoforge:${project.emi_version}:api"
}

processResources {
    var replaceProperties = [
            version: project.version,
            minecraft_version: project.minecraft_version,
            neoforge_version: project.neoforge_version,
            cobblemon_version: project.cobblemon_version,
            kotlin_for_forge_version: project.kotlin_for_forge_version,
            accessories_version: project.accessories_version,
            owo_version: project.neoforge_owo_version,
            architectury_version: project.architectury_version,
            cloth_config_version: project.cloth_config_version,
            midnightlib_version: project.neoforge_midnightlib_version.tokenize('+')[0]
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }

    // Copy resources from common
    from commonProject.sourceSets.main.resources
    from commonProject.sourceSets.client.resources
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "MixinConfigs": "cobblemon-cards.mixins.json"
        ])
    }
    from commonProject.sourceSets.main.output
    from commonProject.sourceSets.client.output
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonProject.sourceSets.main.allSource
    from commonProject.sourceSets.client.allSource
}









