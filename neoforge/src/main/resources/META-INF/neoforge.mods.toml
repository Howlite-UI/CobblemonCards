# The standard mod file for NeoForge
modLoader="javafml"
loaderVersion="[2,)"
license="CC0-1.0"

[[mods]]
modId="cobblemon_cards"
version="${version}"
displayName="Cobblemon Cards"
displayURL="https://github.com/Howlite-UI/CobblemonCards"
logoFile="logo.png"
authors="Howlite"
description='''
An immersive and feature-rich Minecraft mod that introduces the ultimate Trading Card Game to the Cobblemon universe! Collect, trade, grade, and display your favorite Pokémon on gorgeous 3D cards with animated holographic shaders.
'''

[features.cobblemon_cards]
javaVersion="[21,21.999999)"

[[dependencies.cobblemon_cards]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="cobblemon"
type="required"
versionRange="[${cobblemon_version},1.9)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="kotlinforforge"
type="required"
versionRange="[${kotlin_for_forge_version},6)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="accessories"
type="required"
versionRange="[${accessories_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="owo"
type="required"
versionRange="[${owo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="architectury"
type="required"
versionRange="[${architectury_version},14)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},16)"
ordering="NONE"
side="BOTH"

[[dependencies.cobblemon_cards]]
modId="midnightlib"
type="required"
versionRange="[${midnightlib_version},)"
ordering="NONE"
side="BOTH"

# The 1.8.2 item changes require RCT API's matching compatibility fix, when installed.
[[dependencies.cobblemon_cards]]
modId="rctapi"
type="optional"
versionRange="[0.16.2-beta,)"
reason="Cobblemon 1.8.2 requires RCT API 0.16.2-beta or later to avoid crashes involving changed held items."
ordering="NONE"
side="BOTH"

[[mixins]]
config="cobblemon-cards.mixins.json"

# These releases call ElementalType constructors removed by Cobblemon 1.8.2.
[[dependencies.cobblemon_cards]]
modId="releaserewards"
type="incompatible"
versionRange="[3.0.2,3.0.3]"
reason="Parting Gifts 3.0.2/3.0.3 crashes with Cobblemon 1.8.2. Remove it until an upstream fix is available; disabling booster rewards does not fix the addon."
ordering="NONE"
side="BOTH"
