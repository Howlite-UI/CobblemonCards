plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"

    // Cobblemon (Fabric version for compiling the common code)
    modCompileOnly "maven.modrinth:cobblemon:${project.fabric_cobblemon_version}"
    modCompileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // MidnightLib (CompileOnly)
    modCompileOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"

    // Accessories API (shared by Fabric and NeoForge)
    modCompileOnly "io.wispforest:accessories-common:${project.accessories_version}"

    // Recipe Viewer APIs (CompileOnly)
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
}

loom {
    splitEnvironmentSourceSets()

    // Disable run configs in common to avoid clutter
    runConfigs.configureEach {
        ideConfigGenerated = false
    }
}

tasks.named('jar', Jar) {
    exclude("assets/**")
    exclude("data/**")
}

